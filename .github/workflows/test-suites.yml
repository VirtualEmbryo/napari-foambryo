            echo
            tail -n 1 "${RUNNER_TEMP}/pytest-output.txt"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Passed, skipped and failed counts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/junit.xml" <<'PYTHON' | tee -a "${GITHUB_STEP_SUMMARY}"
          # One line of counts from pytest's own report, and the reason of every skip: a change in the skip count
          # is a finding.
          import sys
          import xml.etree.ElementTree as ElementTree
          from collections import Counter

          count, skipped = Counter(), []
          for case in ElementTree.parse(sys.argv[1]).iter("testcase"):
              outcome = next((c.tag for c in case if c.tag in ("skipped", "failure", "error")), "passed")
              count[outcome] += 1
              if outcome == "skipped":
                  skipped.append(f"skipped: {case.get('classname')}.{case.get('name')}: {case.find('skipped').get('message')}")
          names = {"passed": "passed", "skipped": "skipped", "failure": "failed", "error": "errors"}
          print("\n".join(["", *skipped, "", ", ".join(f"{count[k]} {v}" for k, v in names.items())]))
