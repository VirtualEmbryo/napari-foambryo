[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-foambryo"
version = "0.2.0rc1"
description = "Surface tensions and cell pressures of a 2-D or 3-D segmentation, in napari: delaunay-watershed and foambryo"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hervé Turlier", email = "herve.turlier@cnrs.fr" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  # The minimum versions are those the CI's floor jobs test (.github/workflows/test-suites.yml).
  "napari>=0.9",
  "magicgui>=0.7.0",
  "qtpy>=2.4.0",
  "superqt>=0.7.8",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "matplotlib>=3.8.4",
  "psutil>=5.9.4",
  # Until delaunay-watershed 0.8.0 and foambryo 0.8.0 are on PyPI, their floors are their development versions (pip does
  # not accept 0.8.0.dev0 for >=0.8.0): install both from their development repositories. At their release the floors
  # become delaunay-watershed>=0.8.0 and foambryo[cli]>=0.8.0. delaunay-watershed installs dw3d and dw2d.
  "delaunay-watershed>=0.8.0rc1",
  "foambryo[cli]>=0.8.0rc1",
]

[project.urls]
Homepage = "https://github.com/VirtualEmbryo/napari-foambryo"
Source = "https://github.com/VirtualEmbryo/napari-foambryo"
Issues = "https://github.com/VirtualEmbryo/napari-foambryo/issues"
Documentation = "https://github.com/VirtualEmbryo/napari-foambryo/blob/main/docs/how-it-works.md"
Changelog = "https://github.com/VirtualEmbryo/napari-foambryo/blob/main/CHANGELOG.md"
"Team website" = "https://www.turlierlab.com/"

[project.optional-dependencies]
testing = ["pytest", "pytest-qt", "dask[array]"]

[project.entry-points."napari.manifest"]
napari-foambryo = "napari_foambryo:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_foambryo = ["napari.yaml", "sample_data/*.npz", "sample_data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "opengl: needs an OpenGL context (a real napari viewer window)",
  "dataset: needs the benchmarking dataset beside the repository",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PT017", "PT018"]
